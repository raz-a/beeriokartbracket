[package]
name = "beeriokartbracket"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { version = "0.10.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slotmap = { version = "1.1.1", features = ["serde"] }

[workspace]
members = ["gui"]
# The GUI is the default target so `cargo run` launches it. Bare `cargo
# build/test/clippy` therefore also target the GUI; use `--workspace` (or
# `-p beeriokartbracket`) to build/test/lint the library and its domain tests.
default-members = ["gui"]
