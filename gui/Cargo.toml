[package]
name = "beeriokartbracket-gui"
version = "0.1.0"
edition = "2024"

[features]
manual-validation = ["dep:rand"]

[dependencies]
beeriokartbracket = { path = ".." }
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = { version = "0.10.2", optional = true }
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
